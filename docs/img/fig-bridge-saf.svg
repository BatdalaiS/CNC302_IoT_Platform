<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="DejaVu Sans, Arial, sans-serif">
<title>Store-and-forward</title>
<defs><marker id="aB45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect x="90" y="60" width="770" height="210" rx="0" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
<text x="78" y="66" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5B6474" text-anchor="end" font-weight="normal">дараалал</text>
<text x="78" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5B6474" text-anchor="end" font-weight="normal">(мессеж)</text>
<text x="860" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5B6474" text-anchor="end" font-weight="normal">хугацаа →</text>
<rect x="250" y="60" width="370" height="210" rx="0" fill="#FDF3F3" stroke="none" stroke-width="0"/>
<text x="435.0" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#B91C1C" text-anchor="middle" font-weight="bold">өгсөх урсгал (uplink) тасарсан</text>
<text x="170.0" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#15803D" text-anchor="middle" font-weight="bold">хэвийн</text>
<text x="740.0" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#15803D" text-anchor="middle" font-weight="bold">сэргэсэн</text>
<polyline points="90,268 320,268 620,95 660,268 860,268" fill="none" stroke="#2E7D4F" stroke-width="2.6"/>
<polygon points="320,268 620,95 660,268" fill="#2E7D4F" opacity="0.10"/>
<line x1="250" y1="60" x2="250" y2="270" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="250" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#B91C1C" text-anchor="middle" font-weight="normal">таслав</text>
<line x1="320" y1="60" x2="320" y2="270" stroke="#B45309" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="320" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#B45309" text-anchor="middle" font-weight="normal">гүүр анзаарав</text>
<line x1="620" y1="60" x2="620" y2="270" stroke="#15803D" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="620" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#15803D" text-anchor="middle" font-weight="normal">сэргэв</text>
<line x1="254" y1="238" x2="316" y2="238" stroke="#B45309" stroke-width="1.6" marker-end="url(#aB45309)" marker-start="url(#aB45309)"/>
<text x="285.0" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#B45309" text-anchor="middle" font-weight="normal">≤ keepalive</text>
<text x="287.0" y="256" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#B45309" text-anchor="middle" font-weight="normal">(15 с)</text>
<text x="690" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2E7D4F" text-anchor="start" font-weight="bold">дахин илгээх</text>
<text x="690" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2E7D4F" text-anchor="start" font-weight="normal">(replay burst)</text>
<line x1="150" y1="270" x2="150" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<line x1="270" y1="270" x2="270" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<line x1="390" y1="270" x2="390" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<line x1="510" y1="270" x2="510" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<line x1="630" y1="270" x2="630" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<line x1="750" y1="270" x2="750" y2="276" stroke="#5B6474" stroke-width="1.2"/>
<text x="90" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#5B6474" text-anchor="start" font-weight="normal">▲ autosave_interval 60 с: RAM дахь дараалал microSD руу хуулагдана</text>
<text x="30" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#1F2937" text-anchor="start" font-weight="bold">Юу хэмжих вэ</text>
<text x="30" y="362.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1F2937" text-anchor="start" font-weight="normal">• RPO — алдагдсан мессежийн тоо (InfluxDB-ийн integrity хүснэгтэд seq-ийн цоорхой). Терминалаар биш!</text>
<text x="30" y="377.525" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1F2937" text-anchor="start" font-weight="normal">• MTTR — сэргэснээс шугам бүрэн болох хүртэлх хугацаа.</text>
<text x="30" y="393.05" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#1F2937" text-anchor="start" font-weight="normal">• SIGKILL / тэжээл тасрах нь autosave-ээс өмнө болбол RAM дахь дараалал алдагдана; дараалал дүүрвэл ШИНЭ мессеж хаягдана.</text>
</svg>
