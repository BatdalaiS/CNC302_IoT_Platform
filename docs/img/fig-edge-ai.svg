<text x="450" y="408" font-family="Liberation Serif, Times New Roman, Times, serif" font-size="11" fill="#5B6474" text-anchor="middle" font-weight="normal">Зурвасын урт нь схем — бодит харьцааг /sys/class/net/eth0/statistics/tx_bytes-ээр хэмжинэ.</text>
