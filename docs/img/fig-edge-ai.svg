<text x="540" y="316" font-family="Liberation Serif, Times New Roman, Times, serif" font-size="11" fill="#5B6474" text-anchor="start" font-weight="normal">мессежийн тоо, байт → Хүснэгт 6.x-д хэмжинэ</text>
