<text x="450" y="392" font-family="Liberation Serif, Times New Roman, Times, serif" font-size="11" fill="#5B6474" text-anchor="middle" font-weight="normal">Гэрээ нь НЭГ hop-д (клиент ↔ брокер) хамаарна; гүүр мессежийг өөрийн QoS-оор (out 1) дахин нийтэлнэ — MQTT 5.0 §4.3</text>
