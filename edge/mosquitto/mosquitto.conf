# CNC302 — ирмэгийн брокерын үндсэн тохиргоо (Raspberry Pi 3B)
#
# ЧУХАЛ: гүүрний (bridge) тохиргоо энд БИШ, conf.d/bridge.conf файлд байна.
#        Түүнийг `make bridge` комманд .env-ээс үүсгэнэ.

# Бүх сонголтыг mosquitto.conf(5)-тай тулгав: https://mosquitto.org/man/mosquitto-conf-5.html
# "listener"-ийн дараах listener-ийн сонголт (protocol, max_connections) нь
# ЗӨВХӨН тэр listener-т хамаарна; бусад нь глобал.

# ── Сонсох порт ─────────────────────────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt
# listener-ийн сонголт — зөвхөн 1883-т үйлчилнэ
max_connections 1000

# eclipse-mosquitto зураг WITH_WEBSOCKETS=yes-ээр бүтээгдсэн
listener 9001 0.0.0.0
protocol websockets

# ЗӨВХӨН ЛАБОРАТОРИД нээлттэй: лабораториуд ирмэгийн брокерын нэвтрэлтийг
# өөрчилдөггүй. Бодит системд false болгож password_file эсвэл клиентийн
# сертификат (require_certificate) ашиглана.
allow_anonymous true

# ── Тогтвортой хадгалалт (store-and-forward-ийн үндэс) ─────────────────────
# Үүл унасан үед дараалалд орсон мессеж САНАХ ОЙД (RAM) хадгалагдана.
# Диск рүү (mosquitto.db) зөвхөн autosave_interval тутам, зөв зогсоох
# (SIGTERM) үед эсвэл SIGUSR1 дохиогоор хуулагдана. Тиймээс тэжээл тасрах /
# SIGKILL үед сүүлийн autosave-аас хойших мессеж АЛДАГДАНА (Лаб 5-д хэмжинэ:
# SIGTERM → 0 алдагдал, autosave-ийн өмнө SIGKILL → хэдэн зуугаар).
persistence true
persistence_location /mosquitto/data/
# microSD-г хамгаалахын тулд 60 сек тутам нэг удаа бичнэ (анхдагч: 1800)
autosave_interval 60
autosave_on_changes false

# ── Хязгаарлалт (1 GB RAM-ын хамгаалалт) — бүгд глобал ──────────────────────
# Хязгааргүй бол үүл удаан унахад mosquitto бүх RAM-ыг идэж OOM болно.
# max_queued_messages нь КЛИЕНТ ТУС БҮРИЙН дараалал (анхдагч 1000).
# 100 000 мессеж × ~250 байт ≈ 25 MiB ачаалал + брокерын дотоод бүтэц —
# контейнерийн 128 MiB хязгаартай (docker-compose.yml) ЗААВАЛ тулгаж шалга
# (docker stats). Дараалал дүүрэхэд ХАМГИЙН ШИНЭ мессеж чимээгүй хаягдана.
# Лаб 5-д энэ тоог өөрчилж туршина.
max_queued_messages 100000
# Нэг зэрэг дамжиж буй QoS 1/2 мессеж (анхдагч 20)
max_inflight_messages 40
# Бүтэн MQTT пакетийн дээд хэмжээ (байт); илүү том илгээсэн клиент тасарна
max_packet_size 65536

# QoS 0 мессежийг ч дараалалд оруулна (анхны утга: оруулахгүй).
# Гүүр тасрахад QoS 0 телеметр алдагдахгүй болно — Лаб 5-д
# үүнийг унтрааж/асааж алдагдлыг харьцуулна.
queue_qos0_messages true

# ── Лог ─────────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Гүүрний тохиргоог тусад нь ──────────────────────────────────────────────
include_dir /mosquitto/config/conf.d
