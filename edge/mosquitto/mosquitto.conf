# CNC302 — ирмэгийн брокерын үндсэн тохиргоо (Raspberry Pi 3B)
#
# ЧУХАЛ: гүүрний (bridge) тохиргоо энд БИШ, conf.d/bridge.conf файлд байна.
#        Түүнийг `make bridge` комманд .env-ээс үүсгэнэ.

# ── Сонсох порт ─────────────────────────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# Лаб 1–2-т нээлттэй. Лаб 2-ын эцэст үүнийг false болгож,
# password_file / сертификатаар солино.
allow_anonymous true

# ── Тогтвортой хадгалалт (store-and-forward-ийн үндэс) ─────────────────────
# Үүл унасан үед мессежийг ДИСКЭНД хадгалж, холбогдмогц дахин илгээнэ.
# Лаб 5-д яг үүнийг хэмжинэ.
persistence true
persistence_location /mosquitto/data/
# microSD-г хамгаалахын тулд бичилтийг цуглуулж 60 сек тутам нэг удаа хийнэ
autosave_interval 60
autosave_on_changes false

# ── Хязгаарлалт (1 GB RAM-ын хамгаалалт) ───────────────────────────────────
# Хязгааргүй бол үүл удаан унахад mosquitto бүх RAM-ыг идэж OOM болно.
# 100 000 мессеж × ~250 байт ≈ 25 MiB — Лаб 5-д энэ тоог өөрчилж туршина.
max_queued_messages 100000
max_inflight_messages 40
max_packet_size 65536
max_connections 1000

# QoS 0 мессежийг ч дараалалд оруулна (анхны утга: оруулахгүй).
# Гүүр тасрахад QoS 0 телеметр алдагдахгүй болно — Лаб 5-д
# үүнийг унтрааж/асааж алдагдлыг харьцуулна.
queue_qos0_messages true

# ── Лог ─────────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Гүүрний тохиргоог тусад нь ──────────────────────────────────────────────
include_dir /mosquitto/config/conf.d
