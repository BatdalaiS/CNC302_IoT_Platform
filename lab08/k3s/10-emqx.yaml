apiVersion: apps/v1
kind: Deployment
metadata:
  name: emqx
  namespace: cnc302
spec:
  replicas: 1
  selector:
    matchLabels: {app: emqx}
  template:
    metadata:
      labels: {app: emqx}
    spec:
      containers:
        - name: emqx
          image: emqx/emqx:5.8.6
          env:
            - name: EMQX_NODE__NAME
              value: "emqx@127.0.0.1"
            - name: EMQX_DASHBOARD__DEFAULT_USERNAME
              value: "admin"
            - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnc302-secrets, key: EMQX_DASHBOARD_PASSWORD}
          ports:
            - {containerPort: 1883, name: mqtt}
            - {containerPort: 18083, name: dashboard}
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:   {memory: "1Gi",   cpu: "1500m"}
          readinessProbe:
            exec: {command: ["/opt/emqx/bin/emqx", "ctl", "status"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 1883}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /opt/emqx/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: emqx-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: emqx-data, namespace: cnc302}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: emqx, namespace: cnc302}
spec:
  selector: {app: emqx}
  type: NodePort
  ports:
    - {name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883}
    - {name: dashboard, port: 18083, targetPort: 18083, nodePort: 31083}
