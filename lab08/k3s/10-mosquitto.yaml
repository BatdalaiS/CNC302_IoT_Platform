# Ирмэгийн MQTT брокер: локал брокер + үүл рүү ГҮҮР (bridge).
#
# Compose дээрх edge/mosquitto/* файлуудын K8s дахь хувилбар:
#   mosquitto.conf      → ConfigMap
#   conf.d/bridge.conf  → initContainer нь загвараас (ConfigMap) ConfigMap-ийн
#                         CLOUD_HOST/SITE/… утгыг орлуулж emptyDir-т үүсгэнэ
#   mosq-data volume    → PVC (local-path, 1Gi)
#
# Яагаад initContainer вэ: mosquitto.conf нь орчны хувьсагч ОРЛУУЛДАГГҮЙ.
# Тиймээс IP-г 10 газар гараар засахын оронд нэг л ConfigMap-аас (01-config)
# зуурч бичнэ. Энэ бол K8s-ийн стандарт хэв маяг (config templating).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: cnc302
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    protocol mqtt

    # Лаб 2-ын эцэст false болгож password_file/сертификатаар солино
    allow_anonymous true

    # store-and-forward-ийн үндэс (Лаб 5-д хэмжинэ)
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 60          # microSD-г хамгаална
    autosave_on_changes false

    # 1 GB RAM-ын хамгаалалт: хязгааргүй дараалал = OOMKilled
    max_queued_messages 100000
    max_inflight_messages 40
    max_packet_size 65536
    max_connections 1000
    queue_qos0_messages true

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    connection_messages true
    log_timestamp true

    include_dir /mosquitto/config/conf.d

  bridge.conf.tpl: |
    # ирмэг → үүл гүүр. __…__ утгыг initContainer орлуулна.
    connection cloud
    address __CLOUD_HOST__:__CLOUD_PORT__
    remote_clientid edge-__DEVICE_ID__

    # out = ирмэгээс үүл рүү (телеметр), in = үүлээс ирмэг рүү (команд, OTA)
    topic cnc302/__SITE__/# out 1
    topic cnc302/__SITE__/__AREA__/__LINE__/+/cmd    in 1
    topic cnc302/__SITE__/__AREA__/__LINE__/+/config in 1
    topic cnc302/__SITE__/__AREA__/__LINE__/+/ota/#  in 1

    # false = үүл унаад дахин холбогдоход дараалал ХАДГАЛАГДАНА
    cleansession false
    local_cleansession false
    restart_timeout 5 60

    notifications true
    notification_topic cnc302/__SITE__/__AREA__/__LINE__/__DEVICE_ID__/bridge/state

    # Лаб 2-ын эцэст (EMQX-д нэвтрэлт асаах үед) тайлбарыг арилгана:
    #remote_username __CLOUD_USER__
    #remote_password __CLOUD_PASS__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: cnc302
spec:
  # K3s-ийн анхны StorageClass. Өгөгдөл нь Pi-гийн microSD дээр
  # /var/lib/rancher/k3s/storage/… зам дор хадгалагдана.
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi          # microSD жижиг — 1Gi хангалттай
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: cnc302
spec:
  replicas: 1               # ⚠ 1-ээс их болгож БОЛОХГҮЙ: PVC нь ReadWriteOnce,
                            #   мөн хоёр гүүр нэг clientid-аар EMQX рүү орвол
                            #   бие биенээ таслах болно.
  strategy:
    type: Recreate          # RWO PVC-тэй тул шинэ pod нь хуучныг хүлээнэ
  selector:
    matchLabels: {app: mosquitto}
  template:
    metadata:
      labels: {app: mosquitto}
    spec:
      initContainers:
        - name: render-bridge
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s|__CLOUD_HOST__|$CLOUD_HOST|g" \
                  -e "s|__CLOUD_PORT__|$CLOUD_PORT|g" \
                  -e "s|__SITE__|$SITE|g" \
                  -e "s|__AREA__|$AREA|g" \
                  -e "s|__LINE__|$LINE|g" \
                  -e "s|__DEVICE_ID__|$DEVICE_ID|g" \
                  /tpl/bridge.conf.tpl > /conf.d/bridge.conf
              echo "── үүсгэсэн bridge.conf ──"
              cat /conf.d/bridge.conf
          envFrom:
            - configMapRef: {name: cnc302-config}
          resources:
            requests: {memory: "8Mi", cpu: "10m"}
            limits:   {memory: "32Mi", cpu: "200m"}
          volumeMounts:
            - {name: config, mountPath: /tpl, readOnly: true}
            - {name: bridge, mountPath: /conf.d}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 1883, name: mqtt}
          # Хэмжсэн утга: амралтад ~10–14 MiB, Лаб 5-ын дараалал дүүрэхэд
          # ~40 MiB хүртэл өснө. limits 96Mi нь хангалттай нөөцтэй.
          resources:
            requests: {memory: "32Mi", cpu: "50m"}
            limits:   {memory: "96Mi", cpu: "500m"}
          readinessProbe:
            tcpSocket: {port: 1883}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 1883}
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - {name: bridge, mountPath: /mosquitto/config/conf.d, readOnly: true}
            - {name: data, mountPath: /mosquitto/data}
      volumes:
        - name: config
          configMap: {name: mosquitto-config}
        - name: bridge
          emptyDir: {}
        - name: data
          persistentVolumeClaim: {claimName: mosquitto-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: cnc302
spec:
  # NodePort — LAN дээрх бодит төхөөрөмж, багшийн симулятор Pi рүү
  # шууд нийтэлж чадна:  mosquitto_pub -h <pi> -p 31883 …
  # (Кластер дотроос энгийн `mosquitto:1883` нэрээр хандана.)
  type: NodePort
  selector: {app: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883}
