# Ирмэгийн агент — edge/agent/edge_agent.py-ийн контейнер хувилбар.
#
# ⚠ ДҮРС НЬ ЗӨВХӨН PI ДЭЭР БАЙНА. Docker Hub дээр `cnc302/edge-agent` гэж
#   байхгүй. Дүрсийг ЗӨӨВРИЙН КОМПЬЮТЕР дээр linux/arm64-д зориулж бариад,
#   tar хэлбэрээр Pi-гийн K3s containerd руу импортолно (README §4):
#
#     # 💻 зөөврийн компьютер (Docker Desktop, QEMU эмуляц суусан)
#     docker build --platform linux/arm64 -t cnc302/edge-agent:v1 edge/agent
#     docker save --platform linux/arm64 -o edge-agent-v1-arm64.tar cnc302/edge-agent:v1
#     scp edge-agent-v1-arm64.tar cnc302@<pi-IP>:/tmp/
#     # 🥧 Pi — автомат импортын хавтас (https://docs.k3s.io/add-ons/import-images)
#     sudo mkdir -p /var/lib/rancher/k3s/agent/images
#     sudo cp /tmp/edge-agent-v1-arm64.tar /var/lib/rancher/k3s/agent/images/
#     sudo k3s ctr images ls | grep edge-agent
#
# `imagePullPolicy: Never` — kubelet ХЭЗЭЭ Ч татахгүй, зөвхөн зангилаан
#   дээр байгаа дүрсийг ашиглана. K3s-ийн баримт: "Pre-importing images onto
#   the node is essential if you configure imagePullPolicy as Never".
#   Дүрс зангилаан дээр байхгүй бол "startup fails" (kubernetes.io, Images):
#   pod эхлэхгүй бөгөөд шалтгаан нь `kubectl describe pod`-ийн Events-д шууд
#   харагдана — Docker Hub-аас хайх гэж хугацаа алдахгүй.
#   (`IfNotPresent` бол kubelet docker.io/cnc302/edge-agent-ийг татах гэж
#   оролдоно — хэн нэгэн тэр нэрээр дүрс нийтэлбэл ТАНИХГҮЙ код
#   таны ирмэг дээр ажиллана: нийлүүлэлтийн гинжин хэлхээний эрсдэл.)
#
# ⚠ Энэ pod ЗААВАЛ Pi дээр ажиллана (nodeSelector):
#   1. Дүрс нь arm64 бөгөөд зөвхөн Pi-гийн containerd-д импортлогдсон.
#   2. Агент Pi-гийн БОДИТ төмрийг уншина (/sys/class/thermal — hostPath).
#      VM дээр ажиллавал VM-ийн температурыг "Pi-гийнх" гэж нийтэлнэ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-agent
  namespace: cnc302
  labels: {app: edge-agent}
spec:
  replicas: 1
  selector:
    matchLabels: {app: edge-agent}
  template:
    metadata:
      labels: {app: edge-agent}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64      # kubelet бөглөдөг (runtime.GOARCH)
        cnc302/layer: edge             # kubectl label nodes <pi> cnc302/layer=edge
      # ⚠ STATEFUL ирмэгийн ажил. Бүх хувь ИЖИЛ DEVICE_ID-тай (ConfigMap-аас)
      #   тул HPA 2+ хувь болгоход тэд НЭГ UNS сэдэв рүү давхар нийтэлж,
      #   retained `status`-ыг ээлжлэн дарж бичнэ. Доорх POD_NAME-ийг
      #   edge_agent.py ОДООГООР уншдаггүй — энэ бол хяналтын асуултын нэг:
      #   "Stateful ирмэгийн ажлыг Deployment-ээр хувилахад юу эвдрэх вэ?"
      containers:
        - name: agent
          image: cnc302/edge-agent:v1
          imagePullPolicy: Never               # ← зөвхөн импортолсон дүрс
          envFrom:
            - configMapRef: {name: cnc302-config}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          # Курсын хэмжилт: paho + numpy ~55 MiB, TFLite дүгнэлттэй ~110 MiB.
          # requests нь ТОВЛОГЧИД өгөх амлалт (HPA-гийн CPU хувийг ч үүнээс
          # тооцно), limits нь дээд хана — санах ойн limit-ийг давбал цөмийн
          # OOM дэд систем процессыг зогсооно (OOMKilled, Exit 137).
          resources:
            requests: {memory: "96Mi", cpu: "100m"}
            limits:   {memory: "160Mi", cpu: "800m"}
          volumeMounts:
            # Pi-гийн БОДИТ температурыг унших (агентын гол дохио)
            - {name: thermal, mountPath: /sys/class/thermal, readOnly: true}
          # Санамж: агент HTTP endpoint-гүй тул readiness/liveness probe
          # тавиагүй. ОЮУТНЫ ДААЛГАВАР: edge_agent.py-д жижиг /healthz
          # нэмээд энд httpGet probe тавь — pod унасныг K8s хэрхэн
          # мэдэх вэ гэдгийг тайландаа тайлбарла.
      volumes:
        - name: thermal
          hostPath: {path: /sys/class/thermal, type: Directory}
      # Pi 3B дээр pod-ыг дахин эхлүүлэх нь удаан (microSD). Богино
      # хугацаанд олон удаа унтраахгүйн тулд:
      terminationGracePeriodSeconds: 20
