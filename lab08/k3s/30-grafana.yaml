apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: cnc302}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: cnc302-secrets, key: GRAFANA_PASSWORD}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{containerPort: 3000}]
          resources:
            requests: {memory: "128Mi", cpu: "50m"}
            limits:   {memory: "512Mi", cpu: "500m"}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/grafana}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data, namespace: cnc302}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: cnc302}
spec:
  selector: {app: grafana}
  type: NodePort
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
