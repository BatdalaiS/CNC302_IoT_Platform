# НӨӨЦ ХУВИЛБАР — InfluxDB 3 Core ажиллахгүй бол InfluxDB 2.7 руу шилжинэ.
# Ашиглах:
#   docker compose -f docker-compose.yml -f docker-compose.influx2.yml --profile core up -d
# Анхаар: Лаб 5-ын Node-RED урсгал, Grafana-гийн өгөгдлийн эх сурвалж өөр байна
# (InfluxQL/Flux, SQL биш). lab05/reference/influx2/ дотор хувилбар бэлэн байгаа.

services:
  influxdb:
    image: influxdb:2.7
    command: []
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUX2_PASSWORD:-cnc302admin}"
      DOCKER_INFLUXDB_INIT_ORG: cnc302
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX2_TOKEN:-cnc302-lab-token}"
    ports:
      - "8086:8086"
    volumes:
      - influx2-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  influx2-data:
