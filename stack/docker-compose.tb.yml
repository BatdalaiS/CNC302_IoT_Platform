# CNC302 — ThingsBoard (СОНГОЛТОТ, зөвхөн зөөврийн компьютер дээр)
#
# Яагаад сонголтот вэ:
#   ThingsBoard + Postgres нь 1.5–2.5 GB санах ой шаарддаг. Raspberry Pi 3B-д
#   огт багтахгүй. Гол лабораториуд үүнээс хамаарахгүй болгосон — оронд нь
#   өөрсдийн `registry` үйлчилгээг ашиглана (../lab02/registry).
#
# Хэзээ хэрэглэх вэ:
#   • Лаб 2-ын сонголтот В хэсэг: худалдааны платформтой харьцуулах
#   • Зөөврийн компьютерт 16 GB RAM байгаа тохиолдолд
#
# Ажиллуулах:
#   docker compose -f docker-compose.yml -f docker-compose.tb.yml \
#     --profile core --profile tb up -d
#
# Вэб: http://localhost:8080   (sysadmin@thingsboard.org / sysadmin)
#
# ⚠ ХУУЧИН (pinned-legacy) ЗАГВАР — зориуд хадгалсан.
#   ThingsBoard-ын одоогийн албан ёсны Docker заавар (2026-09) нь ХОЁР
#   контейнер ашигладаг: `postgres:18` + `thingsboard/tb-node:4.3.x`, контейнерийн
#   порт 8080, мөн эхлүүлэхээс өмнө `docker compose run --rm -e INSTALL_TB=true
#   -e LOAD_DEMO=true thingsboard-ce` гэж өгөгдлийн санг нэг удаа үүсгэнэ.
#   https://thingsboard.io/docs/installation/docker/
#   Энд харин нэг контейнерт Postgres-ийг багтаасан `tb-postgres:3.9.1`-ийг
#   үлдээв: анх асахдаа өгөгдлийн сангаа өөрөө үүсгэдэг тул Лаб 1–2-ын
#   ганц `up -d` командаар ажиллана. Энэ зургийн HTTP порт нь 9090
#   (зургийн ENV HTTP_BIND_PORT=9090), curl агуулдаггүй (wget бий).
#   Албан ёсны заавар хөгжүүлэлт/PoC-д ч 1 цөм, 4 GB RAM-ыг доод шаардлага гэнэ.

services:
  thingsboard:
    image: thingsboard/tb-postgres:3.9.1
    container_name: cnc302-thingsboard
    profiles: [tb]
    restart: unless-stopped
    environment:
      TB_QUEUE_TYPE: in-memory
      JAVA_OPTS: "-Xms512m -Xmx1500m -XX:MaxDirectMemorySize=256m"
    ports:
      - "8080:9090"     # веб интерфейс
      - "1884:1883"     # ThingsBoard-ын MQTT (EMQX-тэй зөрчилдөхгүйн тулд 1884)
      - "5683:5683/udp" # CoAP
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
    healthcheck:
      # tb-postgres зурагт curl байхгүй — wget ашиглана
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/login || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2500m

volumes:
  tb-data:
  tb-logs:
