# CNC302 — ҮҮЛНИЙ ДАВХАРГА  (оюутны ЗӨӨВРИЙН КОМПЬЮТЕР дээр ажиллана)
#
# ⚠ Энэ файлыг Raspberry Pi 3B дээр ажиллуулах гэж БҮҮ оролд.
#   Pi 3B-д 1 GB санах ой байдаг — энэ стек 3–5 GB шаардана.
#   Pi дээр ажиллах хэсэг нь ../edge/docker-compose.yml файлд байна.
#
# Профайл: core (Лаб1+), pipeline (Лаб5+), app (Лаб7+), ai (Лаб8), tb (сонголт)
#
#   docker compose --profile core up -d
#   docker compose ps
#   docker compose --profile core down

name: cnc302-cloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─────────────────────────── MQTT брокер (үүл) ───────────────────────────
  # Pi дээрх mosquitto энэ брокер руу гүүр (bridge) татна.
  # 0.0.0.0 дээр сонсох ёстой — Pi нь LAN-аар холбогдоно.
  #
  # Хувилбар: 5.8.6-д ЗОРИУД үлдээв.
  #   · Лаб 1–2-ын команд, тохиргоог энэ хувилбар дээр бодитоор туршсан.
  #   · 5.8 нь LTS салбар (EOL 2027-08-27) бөгөөд Apache 2.0 лицензтэй.
  #   · EMQX 5.9.0-ээс эхлэн Business Source License 1.1-д шилжсэн: нэг
  #     зангилаа үнэгүй, кластерт арилжааны лиценз хэрэгтэй (академийн
  #     арилжааны бус хэрэглээ чөлөөлөгдөнө). Лаборатори лицензийн нөхцөлөөс
  #     хамааралгүй байхын тулд 5.8.x. Дараагийн засвар: 5.8.9 (туршаад солино).
  #   https://www.emqx.com/en/content/license-faq
  #   https://docs.emqx.com/en/emqx/latest/changes/eol-ee.html
  emqx:
    image: emqx/emqx:5.8.6
    container_name: cnc302-emqx
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_NODE__COOKIE: "${EMQX_COOKIE}"
      EMQX_DASHBOARD__DEFAULT_USERNAME: "admin"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD}"
      # Лаб 4-т энэ хязгаарыг өөрчилж туршина
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: "10000"
      # Лаб 2-т mTLS-ийг энд асаана (.env: EMQX_TLS_ENABLE=true).
      # ENABLE=false үед доорх файлууд байхгүй ч EMQX 5.8.6 асдаг (шалгасан):
      # "Listener ssl:default is NOT started due to: disabled."
      # EMQX-ийн 8883 анхдагчаар клиентийн сертификат ШААРДДАГГҮЙ — mTLS-д
      # verify_peer + fail_if_no_peer_cert-ийг ил тавина.
      EMQX_LISTENERS__SSL__DEFAULT__ENABLE: "${EMQX_TLS_ENABLE:-false}"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: '"/opt/emqx/etc/cnc302-certs/ca.crt"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: '"/opt/emqx/etc/cnc302-certs/server.crt"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: '"/opt/emqx/etc/cnc302-certs/server.key"'
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    ports:
      - "1883:1883"     # MQTT      ← Pi-гийн гүүр энд холбогдоно
      - "8883:8883"     # MQTT/TLS  (Лаб 2)
      - "8083:8083"     # MQTT/WebSocket (Лаб 7)
      - "18083:18083"   # удирдлагын самбар + REST API
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      # Лаб 2. etc/certs-ийг ДАРЖ БОЛОХГҮЙ: тэнд EMQX-ийн өөрийн сертификат
      # байдаг бөгөөд wss:8084 сонсогч түүнийг ашиглана; дарвал EMQX
      # `no_cert` алдаагаар эхлэхгүй.
      - ./emqx/certs:/opt/emqx/etc/cnc302-certs:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  # ─────────────────────── Цаг цувааны өгөгдлийн сан ───────────────────────
  # InfluxDB 3 Core. Ажиллахгүй бол:
  #   docker compose -f docker-compose.yml -f docker-compose.influx2.yml up -d
  # Зургийн ENTRYPOINT нь /usr/bin/entrypoint.sh, CMD ["influxdb3","serve"];
  # доорх `command` CMD-ийг бүхэлд нь солино.
  # https://docs.influxdata.com/influxdb3/core/get-started/setup/
  #
  # Өгөгдлийн хавтас: процесс uid 1500 (influxdb3)-аар ажилладаг. Зурган дахь
  # /var/lib/influxdb3 нь root-ынх тул named volume-ийг ТЭНД холбовол бичих
  # эрхгүй болно. Иймээс influxdb3 хэрэглэгчийн өөрийн хавтсыг ашиглана
  # (зургийн ENV INFLUXDB3_DATA_DIR=/home/influxdb3/.influxdb3).
  influxdb:
    image: influxdb:3.2-core
    container_name: cnc302-influxdb
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    command:
      - influxdb3
      - serve
      - --node-id=cnc302-node0
      - --object-store=file
      - --data-dir=/home/influxdb3/.influxdb3
      - --http-bind=0.0.0.0:8181
      - --without-auth          # ЗӨВХӨН ЛАБОРАТОРИД. Лаб 7-д үүнийг шүүмжилнэ.
    ports:
      - "8181:8181"
    volumes:
      - influx-data:/home/influxdb3/.influxdb3
    healthcheck:
      # /health нь анхдагчаар токен шаарддаг; --without-auth үед шаардахгүй.
      # Нэвтрэлт асаавал serve-д --disable-authz=health нэмнэ.
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ─────────────────────────── Хяналтын самбар ───────────────────────────
  grafana:
    # 11.6.0 → 11.6.16: ижил 11.6 салбарын засвар. 11.6.0-д CVE-2025-4123
    # (high) ба CVE-2026-27876 (critical) нөлөөлдөг; 11.6.14+ засагдсан.
    image: grafana/grafana:11.6.16
    container_name: cnc302-grafana
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Нэмэлт plugin хэрэггүй (лабораториуд зөвхөн суулгаастай InfluxDB эх
      # сурвалж ашиглана). Хэрэгтэй бол Grafana 11.6-д GF_PLUGINS_PREINSTALL
      # (GF_INSTALL_PLUGINS нь одоо зөвхөн custom image-ийн build-arg).
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────── Төхөөрөмжийн бүртгэл ба OTA сервер (Лаб 2) ───────────────
  # Энэ бол ThingsBoard-ыг орлох ХӨНГӨН бүртгэл. Кодыг нь та ../lab02-д уншина —
  # худалдааны платформ юу хийдгийг далд биш, ил харна.
  registry:
    build:
      context: ../lab02/registry
    image: cnc302/registry:lab02
    container_name: cnc302-registry
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMQX_API: "http://emqx:18083/api/v5"
      EMQX_API_KEY: "${EMQX_API_KEY}"
      EMQX_API_SECRET: "${EMQX_API_SECRET}"
      MQTT_HOST: "emqx"
      MQTT_PORT: "1883"
      # Сонголттой: EMQX-ийн нэвтрэлтийг байнга асаасан үед л хэрэгтэй.
      MQTT_USERNAME: "${REGISTRY_MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${REGISTRY_MQTT_PASSWORD:-}"
      DB_PATH: "/data/registry.db"
      FW_DIR: "/data/firmware"
    ports:
      - "8090:8090"
    volumes:
      - registry-data:/data
    depends_on:
      emqx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  # ─────────────────────── Өгөгдлийн шугам (Лаб 5) ───────────────────────
  nodered:
    image: nodered/node-red:4.0.9     # Лаб 5 энэ хувилбараар шалгагдсан
    container_name: cnc302-nodered
    profiles: [pipeline]
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Ulaanbaatar
      NODE_RED_ENABLE_PROJECTS: "true"
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1880/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────────── Таних тэмдгийн сервер (Лаб 7) ───────────────────
  dex:
    image: dexidp/dex:v2.41.1
    container_name: cnc302-dex
    profiles: [app]
    restart: unless-stopped
    logging: *default-logging
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex:/etc/dex:ro
      - dex-data:/var/dex
    deploy:
      resources:
        limits:
          memory: 256m

  # ─────────────────────── GraphQL давхарга (Лаб 7) ───────────────────────
  graphql-api:
    build:
      context: ../lab07/graphql-api
    image: cnc302/graphql-api:lab07
    container_name: cnc302-graphql
    profiles: [app]
    restart: unless-stopped
    logging: *default-logging
    environment:
      REGISTRY_URL: "http://registry:8090"
      INFLUX_URL: "http://influxdb:8181"
      INFLUX_DB: "cnc302"
      OIDC_ISSUER: "http://dex:5556/dex"
    ports:
      - "8000:8000"
    depends_on:
      - influxdb
    deploy:
      resources:
        limits:
          memory: 512m

  # ─────────────────────── Локал LLM (Лаб 8) ───────────────────────
  # ⚠ Pi 3B дээр НЭГ Ч ХУВИЛБАР ажиллахгүй (1 GB). Зөвхөн зөөврийн компьютер.
  ollama:
    image: ollama/ollama:0.5.13
    container_name: cnc302-ollama
    profiles: [ai]
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  emqx-data:
  emqx-log:
  influx-data:
  grafana-data:
  registry-data:
  nodered-data:
  dex-data:
  ollama-data:
